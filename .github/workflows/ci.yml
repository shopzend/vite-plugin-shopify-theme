name: CI

on:
  pull_request:
  # main push 由 publish.yml 复用本 workflow，避免独立 CI 与发布门禁重复执行。
  workflow_call:

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.14.0"
          - os: ubuntu-latest
            node: "24"
          - os: macos-latest
            node: "24"
          - os: windows-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Node 22.14 是 npm Trusted Publishing 支持的最低 Node 22 版本；24 覆盖当前 LTS。
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node }}

      - run: vp check
      - run: vp run typecheck
      - run: vp run test
      - run: vp run build
      - run: vp run test:package
