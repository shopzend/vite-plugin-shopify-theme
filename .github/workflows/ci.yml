name: CI

on:
  pull_request:
  # main push 由 publish.yml 复用本 workflow，避免独立 CI 与发布门禁重复执行。
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      # 与 publish 同源：setup-vp 安装 Vite+、Node（默认最新 LTS），并自动 vp install
      - uses: voidzero-dev/setup-vp@v1

      - run: vp run typecheck
      - run: vp run test
