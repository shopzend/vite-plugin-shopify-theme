name: CI

on:
  pull_request:
  # main push 由 publish.yml 复用本 workflow，避免独立 CI 与发布门禁重复执行。
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      # Node 取最新 LTS，不在仓库固定版本
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: lts

      - run: vp check
      - run: vp run typecheck
      - run: vp run test
      - run: vp run build
      - run: vp run test:package
