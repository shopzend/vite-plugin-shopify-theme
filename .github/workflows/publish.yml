name: Main CI / Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # main 的唯一 CI；PR 由 ci.yml 自己的 pull_request 触发。
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing OIDC
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"

      # 版本门禁：package.json 里的 version 与 npm 已发布版本不同才继续发布。
      # main 的非版本提交仍跑 check，但会在此跳过 build / publish。
      # 包从未发布时 npm view 失败 → PUBLISHED 为空 → 照常发布。
      - name: Check version
        id: version
        run: |
          LOCAL=$(vp env exec node -p "require('./package.json').version")
          NAME=$(vp env exec node -p "require('./package.json').name")
          PUBLISHED=$(vp pm view "$NAME" version 2>/dev/null || echo "")
          echo "local=$LOCAL published=${PUBLISHED:-<none>}"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - run: vp run build
        if: steps.version.outputs.changed == 'true'

      # npm 侧须预先把本仓库和此 workflow 配置为 Trusted Publisher。
      # npm >=11.5.1 从 GitHub OIDC 换取短期发布凭据，并自动生成 provenance。
      - name: Publish
        if: steps.version.outputs.changed == 'true'
        run: vp env exec --node 24 --npm '^11.5.1' npm publish --ignore-scripts --access public
