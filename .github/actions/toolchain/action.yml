name: Shopify theme toolchain
description: >-
  Check out the caller's theme toolkit, place this plugin revision in its workspace, and install
  locked dependencies with Shopify CLI. Run from a checkout of the theme repository.
inputs:
  toolkit-repo:
    description: Repository containing the theme build workspace
    required: true
  toolkit-ref:
    description: Branch, tag, or commit of the toolkit repository
    required: false
    default: main
  toolkit-ssh-key:
    description: Read-only deploy key for the toolkit repository (or use toolkit-token)
    required: false
  toolkit-token:
    description: Token with read access to the toolkit repository (or use toolkit-ssh-key)
    required: false
outputs:
  toolchain-file:
    description: Actual toolkit commit, installed tool versions, and dependency lockfile digest
    value: ${{ steps.toolchain.outputs.file }}
runs:
  using: composite
  steps:
    - name: Check toolkit access
      shell: bash
      env:
        TOOLKIT_SSH_KEY: ${{ inputs.toolkit-ssh-key }}
        TOOLKIT_TOKEN: ${{ inputs.toolkit-token }}
      run: |
        if [[ -z "$TOOLKIT_SSH_KEY" && -z "$TOOLKIT_TOKEN" ]]; then
          echo "::error::Pass toolkit-ssh-key or toolkit-token for the private toolkit repository."
          exit 1
        fi
    - name: Checkout toolkit
      uses: actions/checkout@v7.0.1
      with:
        repository: ${{ inputs.toolkit-repo }}
        ref: ${{ inputs.toolkit-ref }}
        path: toolkit
        ssh-key: ${{ inputs.toolkit-ssh-key }}
        token: ${{ inputs.toolkit-token || github.token }}
        persist-credentials: false
    # The plugin revision is the one this action runs from, so the caller's `uses:` pin is the
    # only plugin version; the theme repository does not pin it separately.
    - name: Place theme plugin
      shell: bash
      run: |
        plugin_root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        test -f "$plugin_root/package.json"
        rm -rf toolkit/vite-plugin-shopify-theme
        mkdir toolkit/vite-plugin-shopify-theme
        tar -C "$plugin_root" --exclude=./.git --exclude=./node_modules -cf - . \
          | tar -C toolkit/vite-plugin-shopify-theme -xf -
    - name: Install Vite+
      uses: voidzero-dev/setup-vp@v1.21.1
      with:
        working-directory: toolkit
        cache: false
        run-install: false
    - name: Install locked dependencies and Shopify CLI
      shell: bash
      env:
        SHOPIFY_CLI_NO_ANALYTICS: "1"
      run: |
        cd toolkit
        vp install --frozen-lockfile
        vp install --global @shopify/cli@latest
        shopify version
    - name: Record installed toolchain
      id: toolchain
      working-directory: toolkit
      shell: bash
      env:
        TOOLKIT_REPO: ${{ inputs.toolkit-repo }}
        TOOLKIT_REF: ${{ inputs.toolkit-ref }}
        SHOPIFY_CLI_NO_ANALYTICS: "1"
      run: |
        node --input-type=module <<'JS'
        import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
        import { execFileSync } from 'node:child_process';
        import { createHash } from 'node:crypto';
        import { join } from 'node:path';
        const file = join(process.env.RUNNER_TEMP, 'theme-toolchain.json');
        const toolchain = {
          toolkit_repository: process.env.TOOLKIT_REPO,
          toolkit_ref: process.env.TOOLKIT_REF,
          toolkit_sha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
          node_version: process.versions.node,
          shopify_cli_version: execFileSync('shopify', ['version'], { encoding: 'utf8' }).trim(),
          lockfile_sha256: createHash('sha256').update(readFileSync('pnpm-lock.yaml')).digest('hex'),
        };
        writeFileSync(file, `${JSON.stringify(toolchain, null, 2)}\n`);
        appendFileSync(process.env.GITHUB_OUTPUT, `file=${file}\n`);
        JS
